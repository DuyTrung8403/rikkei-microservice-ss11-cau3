spring.application.name=pharmacy-service
server.port=8081
spring.config.import=optional:configserver:http://localhost:8888

# Mở endpoint Actuator để gọi refresh
management.endpoints.web.exposure.include=refresh,health,info

# Cấu hình Kafka Producer (JSON)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Cấu hình Redis Cache Provider (TTL: 60 phút = 3,600,000 ms)
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Cấu hình JPA show-sql để kiểm tra SQL log lần 1 vs lần 2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update


